[package]
name = "royalties-registry"
version = "0.1.0"
description = "Energi GMI NFT Marketplace Royalties Registry Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "royalties_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
